[versions]
kotlin = "2.4.20"
jdk = "25"
compose-plugin = "1.12.1"
# material3 的发行版本独立于 compose 插件（1.12.1 插件内对应 1.9.0，取自插件实现）。
compose-material3 = "1.9.0"
ktor = "3.5.2"
clikt = "5.1.0"
serialization = "1.11.0"
jsqlparser = "5.4"
h2         = "2.3.232"
calcite = "1.42.0"
antlr = "4.13.2"
jooq = "3.21.9"
jgrapht = "1.5.3"
sqlite = "3.53.4.0"
slf4j = "2.0.20"
jmh = "1.37"
mcp = "2.0.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jsqlparser = { module = "com.github.jsqlparser:jsqlparser", version.ref = "jsqlparser" }
h2         = { module = "com.h2database:h2", version.ref = "h2" }
calcite-core = { module = "org.apache.calcite:calcite-core", version.ref = "calcite" }
calcite-server = { module = "org.apache.calcite:calcite-server", version.ref = "calcite" }
calcite-babel = { module = "org.apache.calcite:calcite-babel", version.ref = "calcite" }
antlr-runtime = { module = "org.antlr:antlr4-runtime", version.ref = "antlr" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jgrapht-core = { module = "org.jgrapht:jgrapht-core", version.ref = "jgrapht" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
mcp = { module = "io.modelcontextprotocol.sdk:mcp", version.ref = "mcp" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
