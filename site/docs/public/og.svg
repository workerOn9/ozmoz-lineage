<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="og-t og-d">
  <title id="og-t">ozmoz-lineage —— 渗透血缘</title>
  <desc id="og-d">靛蓝背景上，左侧是啄木鸟图标与 ozmoz-lineage 字标，右侧是淡血缘图水印</desc>
  <style>
    .oz-tile{fill:#3451b2}
    .oz-ink{fill:#ffffff}
    .oz-tone{fill:#cdd9f7}
    .oz-acc{fill:#f59e0b}
    .oz-dim{fill:#ffffff;opacity:.26}
