  <text class="t" x="248" y="260" font-size="70" font-weight="700" letter-spacing="-2" fill="#ffffff">ozmoz-lineage</text>

  <rect x="88" y="318" width="72" height="5" rx="2.5" fill="#f59e0b"/>

  <text class="t" x="88" y="380" font-size="29" fill="#ffffff" fill-opacity=".92">渗透血缘 —— 面向 JVM 生态的离线 SQL 解析 / 血缘 / 方言对照工具链</text>
  <text class="m" x="88" y="428" font-size="20" fill="#ffffff" fill-opacity=".7">ozml parse · lineage · impact · convert · validate · format · serve · mcp</text>

  <text class="t" x="88" y="562" font-size="20" fill="#ffffff" fill-opacity=".62">Apache-2.0 · 解析与血缘全部本地完成，SQL 与元数据不出内网</text>
