<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ozml-og-t ozml-og-d">
  <title id="ozml-og-t">ozmoz-lineage —— 渗透血缘</title>
  <desc id="ozml-og-d">靛蓝背景上，左侧是啄木鸟图标与 ozmoz-lineage 字标，右侧是淡色血缘图水印</desc>

  <rect width="1200" height="630" fill="#3451b2"/>
  <g stroke="#ffffff" stroke-width="3" opacity=".13" fill="none">
    <line x1="742" y1="196" x2="886" y2="140"/>
    <line x1="742" y1="196" x2="886" y2="296"/>
    <line x1="886" y1="140" x2="1030" y2="224"/>
    <line x1="886" y1="296" x2="1030" y2="224"/>
    <line x1="886" y1="296" x2="1030" y2="400"/>
    <line x1="1030" y1="400" x2="1158" y2="296"/>
    <line x1="1030" y1="224" x2="1158" y2="296"/>
    <line x1="886" y1="296" x2="840" y2="440"/>
    <line x1="840" y1="440" x2="1030" y2="400"/>
  </g>
  <g fill="#ffffff" opacity=".13">
    <circle cx="742" cy="196" r="9"/>
    <circle cx="886" cy="140" r="9"/>
    <circle cx="886" cy="296" r="9"/>
    <circle cx="1030" cy="224" r="9"/>
    <circle cx="1030" cy="400" r="9"/>
    <circle cx="1158" cy="296" r="9"/>
    <circle cx="840" cy="440" r="9"/>
  </g>

  <!-- 嵌套 svg：把图标图形缩进这个 132×132 的框，同时顺带把它的 .oz-* 类带进本文件
       （SVG 里的 <style> 是文档级的，所以嵌套进来即可复用，不必抄一份配色） -->
  <svg x="88" y="168" width="132" height="132" viewBox="0 0 64 64"><style>
    /* 配色 token。改这里即可整体换色；derive.mjs 的单色版靠覆盖这些类实现。
       色板不引入新色：主色沿用原 favicon 的靛蓝，强调色是站点已有的告警琥珀。 */
    .oz-tile{fill:var(--oz-tile,#3451b2)}
    .oz-ink{fill:var(--oz-ink,#ffffff)}
    .oz-tone{fill:var(--oz-tone,#cdd9f7)}
    .oz-acc{fill:var(--oz-accent,#f59e0b)}
    /* 树干：叠在本体色上压暗一档，不单独引色 */
    .oz-dim{fill:var(--oz-ink,#ffffff);opacity:.26}
    .oz-acc-s{fill:none;stroke:var(--oz-accent,#f59e0b);stroke-width:2.4;stroke-linecap:round}
  </style>
  <defs>
    <!-- 眼睛与虫洞用 mask 打**真孔**，而不是「画一块底色上去」：
         同一份图形因此在彩色底、浅底、深底、单色下都成立，不必为每种底色复制一套。 -->
    <mask id="ozml-holes">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="35.5" cy="22" r="3" fill="#000"/>
      <circle cx="14.5" cy="16" r="2.4" fill="#000"/>
      <circle cx="14.5" cy="30" r="2.4" fill="#000"/>
      <circle cx="14.5" cy="44" r="2.4" fill="#000"/>
    </mask>
  </defs>

  <rect class="oz-tile" width="64" height="64" rx="14"/>

  <g mask="url(#ozml-holes)">
    <!-- 树干 -->
    <rect class="oz-dim" x="8" y="2" width="13" height="60" rx="6"/>
    <!-- 尾羽：从躯干延续下来的楔形，斜撑在树干上（啄木鸟攀附姿态的支点） -->
    <path class="oz-tone" d="M40 48 C42 54 38 59 31 61 L22 59 L30 45 Z"/>
    <!-- 躯干 -->
    <ellipse class="oz-tone" cx="38" cy="41" rx="12.5" ry="14"/>
    <!-- 头 -->
    <circle class="oz-ink" cx="39" cy="23" r="13"/>
    <!-- 冠羽：单个向后倒的羽束，末端收尖，避免读成王冠 -->
    <path class="oz-acc" d="M34.5 12 C39 4.5 49 3.5 53.5 9.5 L56 7.5 L52.5 16.5 C49.5 21.5 40 20 34.5 12 Z"/>
    <!-- 喙 -->
    <path class="oz-acc" d="M27 20.5 L9.5 25.5 L27 29.5 Z"/>
    <!-- 爪 -->
    <path class="oz-acc-s" d="M31 51 L21 52"/>
    <path class="oz-acc-s" d="M32 56 L21 58"/>
  </g></svg>
  <text x="248" y="260" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="70" font-weight="700" letter-spacing="-2" fill="#ffffff">ozmoz-lineage</text>

  <rect x="88" y="318" width="72" height="5" rx="2.5" fill="#f59e0b"/>

  <text x="88" y="380" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="29" fill="#ffffff" fill-opacity=".92">渗透血缘 —— 面向 JVM 生态的离线 SQL 解析 / 血缘 / 方言对照工具链</text>
  <text x="88" y="428" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#ffffff" fill-opacity=".7">ozml parse · lineage · impact · convert · validate · format · serve · mcp</text>

  <text x="88" y="562" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif" font-size="20" fill="#ffffff" fill-opacity=".62">Apache-2.0 · 解析与血缘全部本地完成，SQL 与元数据不出内网</text>
</svg>
